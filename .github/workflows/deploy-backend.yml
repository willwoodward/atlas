name: Deploy backend to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'agent/**'
      - 'sandbox/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/atlas
            git pull origin main
            # Services are named explicitly; adding one to docker-compose.yml is
            # not enough on its own, it has to be listed on this line too.
            #
            # `sandbox` is deliberately left out while agent coding is switched
            # off (ATLAS_AGENT_CODING): naming it here restarted it on every
            # deploy, undoing `docker compose stop sandbox`. Add it back when
            # turning coding on.
            docker compose up -d --build api agent
