name: Deploy backend to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'agent/**'
      - 'sandbox/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/atlas
            git pull origin main
            # Name every service. `sandbox` was missing here, so the coding
            # agent had nothing to SSH into in production — it was only ever
            # exercised locally. Adding a service to docker-compose.yml is not
            # enough on its own; it has to be listed on this line too.
            docker compose up -d --build api agent sandbox
